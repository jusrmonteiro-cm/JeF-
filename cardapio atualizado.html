<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardápio – Almoço 05/12/2026</title>
<style>
:root{--bg:#faf6f0;--card:#fff;--tx:#2b2622;--mut:#7a6f66;--ac:#a8743a;--bd:#e7ddd0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1814;--card:#262019;--tx:#f1e9df;--mut:#a89b8d;--ac:#d9a566;--bd:#3a3128;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1814;--card:#262019;--tx:#f1e9df;--mut:#a89b8d;--ac:#d9a566;--bd:#3a3128;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;text-align:center;margin:8px 0 2px;color:var(--ac)}
.sub{text-align:center;color:var(--mut);margin:0 0 20px;font-family:system-ui,sans-serif;font-size:14px}
h2{font-size:20px;margin:28px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
label.f{display:block;font-family:system-ui,sans-serif;font-size:13px;color:var(--mut);margin:10px 0 4px}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.row{display:flex;gap:10px}.row>div{flex:1}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.n{font-weight:bold}.d{font-size:13px;color:var(--mut);font-family:system-ui,sans-serif}
.p{color:var(--ac);font-family:system-ui,sans-serif;font-size:14px;margin-top:2px}
.q{display:flex;align-items:center;gap:8px;font-family:system-ui,sans-serif}
.q button{width:34px;height:34px;border-radius:50%;border:1px solid var(--ac);background:transparent;color:var(--ac);font-size:20px;line-height:1}
.q span{min-width:20px;text-align:center;font-weight:bold}
.item.on .n{color:var(--ac)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px;margin-top:8px}
.btn.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
pre{white-space:pre-wrap;font-family:system-ui,sans-serif;font-size:14px;margin:0}
.err{color:#c0392b;font-family:system-ui,sans-serif;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>🍽️ Cardápio do Almoço</h1>
<p class="sub">05 de dezembro de 2026</p>

<div class="card">
  <label class="f" for="nome">Nome</label>
  <input id="nome" placeholder="Seu nome completo" autocomplete="name">
  <div class="row">
    <div><label class="f" for="mesa">Nº da mesa</label><input id="mesa" inputmode="numeric" placeholder="Ex.: 7"></div>
    <div><label class="f" for="tel">Telefone</label><input id="tel" type="tel" inputmode="tel" placeholder="(00) 00000-0000" autocomplete="tel"></div>
  </div>
  <label class="f">Data do evento</label>
  <input value="05 de dezembro de 2026" readonly>
</div>

<div id="menu"></div>

<h2>Seu pedido</h2>
<div class="card"><pre id="resumo">Nenhum item selecionado.</pre><div class="err" id="err"></div></div>
<button class="btn" id="copiar">Copiar pedido</button>
<button class="btn s" id="limpar">Limpar seleção</button>
</main>

<script>
var MENU=[
{t:"🍽️ Pratos",s:[
 ["Arroz Cremoso com Camarão","Finalizado com queijo parmesão."],
 ["Arroz Cremoso com Carne de Sol","Carne de Sol desfiada, finalizado com queijo coalho."]]},
{t:"🍺 Cervejas",s:[
 ["Heineken","","R$ 16,00"],["Heineken Ultimate","","R$ 16,00"],["Stella Artois","","R$ 14,00"],
 ["Stella Puro Gold","","R$ 14,00"],["Corona","","R$ 15,00"],["Spaten","","R$ 12,00"]]},
{t:"🍸 Gins",s:[
 ["Gin Pink","Gin de pitaya, cordial de limão, água tônica e gelo.","R$ 30,00"],
 ["Gin Tropical","Gin, cordial de maracujá, red bull tropical e gelo.","R$ 32,00"],
 ["Gin Tônica","Gin, água tônica e gelo.","R$ 30,00"],
 ["Melancita","Gin, energético de melancia, cordial de limão e gelo.","R$ 32,00"],
 ["Afrodisíaco","Gin, cordial de maracujá, aperol, xarope pink limonade, xarope de fruta…","R$ 34,00"]]},
{t:"🍋 Caipirinhas",s:[
 ["Caipirinha de Limão","","R$ 19,00"],["Caipirinha de Abacaxi","","R$ 21,00"],["Caipirinha de Maracujá","","R$ 21,00"],
 ["Caipirinha de Kiwi","","R$ 21,00"],["Caipirinha de Cajá","","R$ 21,00"],["Caipirinha de Caju","","R$ 21,00"],["Caipirinha de Morango","","R$ 21,00"]]},
{t:"🍓 Caipiroscas",s:[
 ["Caipirosca de Limão","","R$ 21,00"],["Caipirosca de Abacaxi","","R$ 23,00"],["Caipirosca de Maracujá","","R$ 23,00"],
 ["Caipirosca de Morango","","R$ 23,00"],["Caipirosca de Kiwi","","R$ 23,00"],["Caipirosca de Cajá","","R$ 23,00"],["Caipirosca de Caju","","R$ 23,00"]]},
{t:"🌅 Drinks da Casa",s:[
 ["Redonda (Vodka)","","R$ 24,00"],["Sunset (Vodka)","","R$ 24,00"],["Maria Rita (Vodka)","","R$ 24,00"],["Acaju (Vodka)","","R$ 24,00"],
 ["Redonda (Cachaça)","","R$ 24,00"],["Sunset (Cachaça)","","R$ 24,00"],["Maria Rita (Cachaça)","","R$ 24,00"],["Acaju (Cachaça)","","R$ 24,00"]]},
{t:"🥃 Drinks Clássicos e Autorais",s:[
 ["Mojito","Rum bacardi, xarope de açúcar, limão, hortelã e gelo.","R$ 29,00"],
 ["Aperol Spritz","Aperol, prosecco, água com gás, laranja e especiarias.","R$ 31,00"],
 ["Mar da Gil","Vodka, licor de pêssego, curaçau blue, cordial de limão, espuma de…","R$ 34,00"],
 ["Magil Mule","Cachaça envelhecida, cordial de limão, bitter, espuma de tamarindo e…","R$ 31,00"],
 ["Icedcoffee","Jameson, café expresso, limoncello, cordial de gengibre, cordial de…","R$ 30,00"],
 ["Negroni","Gin, campari, vermouth e gelo.","R$ 32,00"],
 ["Seupaulo","Cachaça envelhecida, campari, vermouth, cordial de gengibre, limoncello,…","R$ 35,00"],
 ["Desaboya-Oanjo","Whisky, geleia de abacaxi e canela, licor gabriela, xarope pink lemonade…","R$ 35,00"],
 ["Piñadescolada","Rum bacardi, rum malibu, cordial de limão, leite condensado, abacaxi e…","R$ 35,00"],
 ["Moscowmule","Vodka, cordial de gengibre, espuma de gengibre e gelo.","R$ 31,00"],
 ["Niccoblue","Vodka, licor de limão, cordial de limão, curaçau blue, folhas de hortelã,…","R$ 32,00"],
 ["Fitzgerald","Gin, licor de limão, bitter aromático, limão siciliano, Limão Taiti e gelo.","R$ 30,00"]]},
{t:"🍹 Sucos (copo 400ml)",s:[
 ["Suco de Abacaxi"],["Suco de Acerola"],["Suco de Cajá"],["Suco de Caju"],["Suco de Laranja"],["Suco de Limão"],
 ["Suco de Maracujá"],["Suco de Morango"],["Suco de Laranja com Morango"],["Suco de Abacaxi com Hortelã"],["Suco de Maracujá com Morango"]]},
{t:"🥤 Refrigerantes e outras bebidas",s:[
 ["Coca Cola"],["Coca Zero"],["Coca Cola Zero 0"],["Guaraná Antártica"],["Guaraná Antártica Zero"],["Sprite Limão"],
 ["Cajuína São Geraldo"],["Cajuína São Geraldo Zero"],["Limoneto H2O"],["Heineken 0% Álcool"],["Red Bull"]]},
{t:"💧 Águas",s:[["Água Mineral 500ml"],["Água com Gás"],["Água de Coco (fruta)"]]}
];
var qtd={};
function render(){
 var h="";
 MENU.forEach(function(c,ci){
  h+='<h2>'+c.t+'</h2><div class="card">';
  c.s.forEach(function(it,ii){
   var k=ci+"-"+ii,v=qtd[k]||0;
   h+='<div class="item'+(v?' on':'')+'"><div><div class="n">'+it[0]+'</div>'+(it[1]?'<div class="d">'+it[1]+'</div>':'')+(it[2]?'<div class="p">'+it[2]+'</div>':'')+'</div>'+
   '<div class="q"><button data-k="'+k+'" data-d="-1" aria-label="Remover">−</button><span>'+v+'</span><button data-k="'+k+'" data-d="1" aria-label="Adicionar">+</button></div></div>';
  });
  h+='</div>';
 });
 document.getElementById("menu").innerHTML=h;
 document.getElementById("resumo").textContent=texto();
}
function texto(){
 var l=[];
 MENU.forEach(function(c,ci){c.s.forEach(function(it,ii){var v=qtd[ci+"-"+ii];if(v)l.push(v+"x "+it[0]);});});
 return l.length?l.join("\n"):"Nenhum item selecionado.";
}
document.getElementById("menu").addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 var k=b.dataset.k,v=Math.max(0,(qtd[k]||0)+parseInt(b.dataset.d,10));
 qtd[k]=v;var y=window.scrollY;render();window.scrollTo(0,y);
});
document.getElementById("limpar").onclick=function(){qtd={};render();};
document.getElementById("copiar").onclick=function(){
 var err=document.getElementById("err");err.textContent="";
 var n=document.getElementById("nome").value.trim(),m=document.getElementById("mesa").value.trim(),t=document.getElementById("tel").value.trim();
 if(!n||!m||!t){err.textContent="Preencha nome, mesa e telefone.";return;}
 var s="Almoço – 05/12/2026\nNome: "+n+"\nMesa: "+m+"\nTelefone: "+t+"\n\nPedido:\n"+texto();
 if(navigator.clipboard){navigator.clipboard.writeText(s).then(function(){err.textContent="Pedido copiado ✔";},function(){err.textContent="Não foi possível copiar.";});}
 else{err.textContent="Copie manualmente o resumo acima.";}
};
render();
</script>
</body>
</html>
